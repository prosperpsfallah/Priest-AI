<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRIEST AI</title>
<style>
:root {
    --bg1: #212121; --bg2: #2f2f2f; --bg3: #404040;
    --border1: #555; --border2: #4d4d4d;
    --text1: #ececf1; --text2: #c5c5d2; --text3: #8e8ea0;
    --accent: #10a37f;
}
body.light {
    --bg1: #ffffff; --bg2: #f7f7f8; --bg3: #ececf1;
    --border1: #d9d9e3; --border2: #e5e5e5;
    --text1: #000; --text2: #444; --text3: #6e6e80;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:var(--bg1);color:var(--text1);height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border2);background:var(--bg1);position:sticky;top:0;z-index:10}
header h1{font-size:16px;font-weight:600}
.icon-btn{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:6px}
.chat-container{flex:1;overflow-y:auto;padding:20px}
.message{display:flex;gap:12px;margin-bottom:20px;max-width:800px;margin-left:auto;margin-right:auto}
.message-avatar{width:30px;height:30px;border-radius:4px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0}
.message.user.message-avatar{background:#5436da}
.message-content{flex:1;line-height:1.6}
.welcome{text-align:center;padding:40px 20px}
.welcome-logo{width:60px;height:60px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;margin:0 auto 20px}
.suggestions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.suggestion{background:var(--bg2);border:1px solid var(--border2);padding:10px 16px;border-radius:12px;cursor:pointer;font-size:14px;color:var(--text2)}
.suggestion:hover{background:var(--bg3)}
.input-area{padding:16px;border-top:1px solid var(--border2);background:var(--bg1)}
.input-wrapper{max-width:800px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:8px}
.input-wrapper textarea{flex:1;background:transparent;border:none;outline:none;color:var(--text1);font-size:16px;resize:none;max-height:200px;padding:8px}
.send-btn{background:var(--accent);border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.send-btn:disabled{opacity:0.5;cursor:not-allowed}
.image-preview{max-width:300px;max-height:300px;border-radius:12px;margin-top:8px;border:1px solid var(--border2)}
</style>
</head>
<body>
<header>
    <button class="icon-btn" id="menuButton">☰</button>
    <h1>PRIEST AI</h1>
    <button class="icon-btn" id="themeToggle">☀️</button>
</header>

<div class="chat-container" id="chat">
    <div class="welcome" id="welcome">
        <div class="welcome-logo">P</div>
        <h1>PRIEST AI</h1>
        <p>Your AI assistant for NAI GARMAI SCHOOL</p>
        <div class="suggestions">
            <button class="suggestion" data-prompt="What can you help me with?">What can you help me with?</button>
            <button class="suggestion" data-prompt="Help me write code">Help me write code</button>
            <button class="suggestion" data-prompt="Explain this topic">Explain this topic</button>
        </div>
    </div>
</div>

<div class="input-area">
    <form class="input-wrapper" id="chatForm">
        <input type="file" id="imageInput" accept="image/*" style="display:none">
        <button type="button" class="icon-btn" onclick="document.getElementById('imageInput').click()">+</button>
        <textarea id="messageInput" placeholder="Message PRIEST AI..." rows="1"></textarea>
        <button type="submit" class="send-btn" id="sendBtn">➤</button>
    </form>
</div>

<script>
let uploadedImage = null;

// THEME
const themeToggle = document.getElementById("themeToggle");
themeToggle.addEventListener("click", () => {
    document.body.classList.toggle("light");
    themeToggle.textContent = document.body.classList.contains("light")? "🌙" : "☀️";
    localStorage.setItem("theme", document.body.classList.contains("light")? "light" : "dark");
});
if(localStorage.getItem("theme") === "light"){
    document.body.classList.add("light");
    themeToggle.textContent = "🌙";
}

// IMAGE UPLOAD
document.getElementById("imageInput").addEventListener("change", e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = event => {
        uploadedImage = event.target.result;
        addMessage("You", `<img src="${uploadedImage}" class="image-preview"><div>Image uploaded. Ask me about it.</div>`, "user");
        document.getElementById("messageInput").placeholder = "Ask about this image...";
    };
    reader.readAsDataURL(file);
});

// SEND MESSAGE
document.getElementById("chatForm").addEventListener("submit", async e => {
    e.preventDefault();
    const input = document.getElementById("messageInput");
    const text = input.value.trim();
    if(!text &&!uploadedImage) return;

    document.getElementById("welcome")?.remove();
    addMessage("You", text, "user");
    input.value = "";

    const thinking = addMessage("PRIEST AI", "Thinking... 🤔", "ai");

    try{
        const res = await fetch("/api/chat", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({message: text, image: uploadedImage})
        });
        const data = await res.json();
        thinking.remove();
        addMessage("PRIEST AI", data.answer || "No response", "ai");
        uploadedImage = null;
        document.getElementById("imageInput").value = "";
        document.getElementById("messageInput").placeholder = "Message PRIEST AI...";
    }catch(err){
        thinking.remove();
        addMessage("PRIEST AI", "Error: " + err.message, "ai");
    }
});

// ADD MESSAGE
function addMessage(name, text, type){
    const chat = document.getElementById("chat");
    const msg = document.createElement("div");
    msg.className = "message " + type;
    msg.innerHTML = `
        <div class="message-avatar">${type === "ai"? "P" : "U"}</div>
        <div class="message-content"><strong>${name}</strong><div style="margin-top:4px">${text}</div></div>
    `;
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
    return msg;
}

// SUGGESTIONS
document.querySelectorAll(".suggestion").forEach(btn => {
    btn.addEventListener("click", () => {
        document.getElementById("messageInput").value = btn.dataset.prompt;
        document.getElementById("chatForm").dispatchEvent(new Event('submit'));
    });
});

// ENTER TO SEND
document.getElementById("messageInput").addEventListener("keydown", e => {
    if(e.key === "Enter" &&!e.shiftKey){e.preventDefault();document.getElementById("chatForm").dispatchEvent(new Event('submit'))}
});
</script>
</body>
</html>
