<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#080a0f"
    >

    <title>PRIEST AI</title>

    <link
        rel="stylesheet"
        href="./style.css?v=999"
    >

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #080a0f !important;
            color: #ffffff !important;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow: hidden;
        }

        .app {
            width: 100%;
            height: 100vh;

            display: flex;

            background:
                #080a0f !important;
        }

        /* SIDEBAR */

        .sidebar {
            width: 270px;
            height: 100vh;

            flex-shrink: 0;

            display: flex;
            flex-direction: column;

            background:
                #0d1118 !important;

            color: #ffffff !important;

            border-right:
                1px solid #202631;
        }

        .sidebar-header {
            height: 72px;

            display: flex;
            align-items: center;

            padding: 0 18px;

            border-bottom:
                1px solid #202631;
        }

        .logo {
            display: flex;
            align-items: center;

            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background:
                #ffffff !important;

            color:
                #080a0f !important;

            font-weight: 800;
        }

        .logo-text {
            color:
                #ffffff !important;

            font-size: 18px;
            font-weight: 700;
        }

        .new-chat {
            margin: 18px;

            padding: 13px;

            border:
                1px solid #303744;

            border-radius: 10px;

            background:
                #151a23 !important;

            color:
                #ffffff !important;

            cursor: pointer;

            font-size: 14px;
        }

        .sidebar-content {
            flex: 1;

            overflow-y: auto;

            padding: 0 12px;
        }

        .sidebar-title {
            padding:
                12px 8px;

            color:
                #778191 !important;

            font-size: 11px;

            text-transform:
                uppercase;
        }

        .chat-item {
            padding:
                11px 12px;

            border-radius: 8px;

            color:
                #c5ccd7 !important;

            font-size: 14px;
        }

        .sidebar-footer {
            padding: 14px;

            border-top:
                1px solid #202631;
        }

        .user-profile {
            display: flex;
            align-items: center;

            gap: 10px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                #1c2330 !important;

            color:
                #ffffff !important;
        }

        .user-name {
            color:
                #ffffff !important;
        }


        /* MAIN */

        .main {
            flex: 1;

            min-width: 0;

            height: 100vh;

            display: flex;
            flex-direction: column;

            background:
                #080a0f !important;
        }


        /* TOP BAR */

        .topbar {
            height: 68px;
            min-height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                0 22px;

            background:
                #0b0e14 !important;

            border-bottom:
                1px solid #202631;
        }

        .topbar-left {
            display: flex;

            align-items: center;

            gap: 12px;
        }

        .topbar-title {
            color:
                #ffffff !important;

            font-size: 16px;

            font-weight: 600;
        }

        .status {
            display: flex;

            align-items: center;

            gap: 7px;

            color:
                #8d96a5 !important;

            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background:
                #39d98a;
        }


        /* CHAT */

        .chat-container {
            flex: 1;

            overflow-y: auto;

            background:
                #080a0f !important;

            padding:
                30px 20px;
        }

        .chat {
            width: 100%;

            max-width: 850px;

            margin: 0 auto;
        }


        /* WELCOME */

        .welcome {
            min-height:
                calc(100vh - 190px);

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;
        }

        .welcome-logo {
            width: 72px;
            height: 72px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background:
                #ffffff !important;

            color:
                #080a0f !important;

            font-size: 30px;

            font-weight: 800;

            margin-bottom: 20px;
        }

        .welcome h1 {
            margin:
                0 0 10px;

            color:
                #ffffff !important;

            font-size: 32px;
        }

        .welcome p {
            max-width:
                520px;

            color:
                #8d96a5 !important;

            line-height:
                1.6;
        }


        /* SUGGESTIONS */

        .suggestions {
            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 9px;

            margin-top: 25px;
        }

        .suggestion {
            padding:
                10px 14px;

            border:
                1px solid #272e39;

            border-radius: 10px;

            background:
                #11161f !important;

            color:
                #b9c1cc !important;

            cursor: pointer;

            font-size: 14px;
        }

        .suggestion:hover {
            background:
                #1b222d !important;

            color:
                #ffffff !important;
        }


        /* MESSAGES */

        .message {
            display: flex;

            gap: 14px;

            margin-bottom: 26px;
        }

        .message.user {
            justify-content:
                flex-end;
        }

        .message-content {
            max-width:
                75%;

            padding:
                13px 16px;

            border-radius:
                14px;

            color:
                #ffffff !important;

            line-height:
                1.6;
        }

        .message.user
        .message-content {
            background:
                #1b222d !important;

            border:
                1px solid #29313d;
        }

        .message.ai
        .message-content {
            background:
                transparent !important;

            color:
                #e4e8ee !important;
        }

        .message-avatar {
            width: 34px;
            height: 34px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background:
                #ffffff !important;

            color:
                #080a0f !important;

            font-weight: 800;
        }


        /* INPUT */

        .input-area {
            width: 100%;

            padding:
                15px 20px 20px;

            background:
                #080a0f !important;
        }

        .input-wrapper {
            width: 100%;

            max-width: 850px;

            margin: auto;
        }

        .input-box {
            width: 100%;

            min-height: 58px;

            display: flex;

            align-items: center;

            gap: 8px;

            padding:
                8px 10px;

            background:
                #11161f !important;

            border:
                1px solid #2a313d;

            border-radius:
                16px;
        }

        textarea {
            flex: 1;

            min-height: 40px;

            border: none;

            outline: none;

            resize: none;

            background:
                transparent !important;

            color:
                #ffffff !important;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 15px;
        }

        textarea::placeholder {
            color:
                #707988 !important;
        }

        .image-upload {
            width: 40px;
            height: 40px;

            display: flex;

            align-items: center;
            justify-content: center;

            color:
                #929baa !important;

            cursor: pointer;

            font-size: 23px;
        }

        .send-button {
            width: 42px;
            height: 42px;

            border: none;

            border-radius: 11px;

            background:
                #ffffff !important;

            color:
                #080a0f !important;

            font-size: 20px;

            font-weight: bold;

            cursor: pointer;
        }

        .send-button:active {
            transform:
                scale(0.95);
        }


        /* MOBILE */

        .menu-button {
            display: none;

            width: 40px;
            height: 40px;

            align-items: center;
            justify-content: center;

            border: none;

            border-radius: 9px;

            background:
                #151a23 !important;

            color:
                #ffffff !important;

            font-size: 20px;
        }


        @media (max-width: 768px) {

            .sidebar {
                position: fixed;

                left: -280px;

                top: 0;

                z-index: 1000;

                transition:
                    left .25s ease;
            }

            .sidebar.open {
                left: 0;
            }

            .menu-button {
                display: flex;
            }

            .topbar {
                padding:
                    0 14px;
            }

            .chat-container {
                padding:
                    20px 12px;
            }

            .welcome h1 {
                font-size: 27px;
            }

            .suggestions {
                display: none;
            }

            .input-area {
                padding:
                    10px 10px 14px;
            }

            .message-content {
                max-width:
                    85%;
            }
        }

    </style>

</head>


<body>


<div class="app">


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-header">

            <div class="logo">

                <div class="logo-icon">
                    P
                </div>

                <div class="logo-text">
                    PRIEST AI
                </div>

            </div>

        </div>


        <button
            class="new-chat"
            id="newChat"
            type="button"
        >
            + New Chat
        </button>


        <div class="sidebar-content">

            <div class="sidebar-title">
                Chat History
            </div>

            <div
                class="chat-history"
                id="chatHistory"
            >

                <div class="chat-item">
                    Welcome to PRIEST AI
                </div>

            </div>

        </div>


        <div class="sidebar-footer">

            <div class="user-profile">

                <div class="user-avatar">
                    P
                </div>

                <div class="user-name">
                    Priest
                </div>

            </div>

        </div>

    </aside>


    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="main">


        <!-- TOP BAR -->

        <header class="topbar">

            <div class="topbar-left">

                <button
                    class="menu-button"
                    id="menuButton"
                    type="button"
                >
                    ☰
                </button>

                <div class="topbar-title">
                    PRIEST AI
                </div>

            </div>


            <div class="status">

                <span class="status-dot"></span>

                Online

            </div>

        </header>


        <!-- =================================================
             CHAT
        ================================================== -->

        <section
            class="chat-container"
            id="chatContainer"
        >

            <div
                class="chat"
                id="chat"
            >

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-logo">
                        P
                    </div>

                    <h1>
                        PRIEST AI
                    </h1>

                    <p>
                        Your AI assistant for questions,
                        ideas, coding, learning and creative work.
                    </p>


                    <div class="suggestions">

                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="What can you help me with?"
                        >
                            What can you help me with?
                        </button>


                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="Help me write some code"
                        >
                            Help me write some code
                        </button>


                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="Explain something to me"
                        >
                            Explain something
                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- =================================================
             INPUT
        ================================================== -->

        <div class="input-area">

            <div class="input-wrapper">

                <form
                    class="input-box"
                    id="chatForm"
                >


                    <label
                        class="image-upload"
                        for="imageInput"
                    >
                        +
                    </label>


                    <input
                        type="file"
                        id="imageInput"
                        accept="image/*"
                        hidden
                    >


                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Message PRIEST AI..."
                        autocomplete="off"
                    ></textarea>


                    <button
                        class="send-button"
                        id="sendButton"
                        type="submit"
                    >
                        ↑
                    </button>


                </form>

            </div>

        </div>


    </main>

</div>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script src="./script.js?v=999"></script>


</body>

</html>
