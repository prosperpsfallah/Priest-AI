<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta
        name="theme-color"
        content="#080a0f"
    >
    <meta
        name="description"
        content="PRIEST AI - Your intelligent AI assistant"
    >
    <title>PRIEST AI</title>
    <!-- Main stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ================= APP ================= -->
    <div class="app">
        <!-- ================= SIDEBAR ================= -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-logo">P</div>
                    <div class="brand-text">
                        <strong>PRIEST AI</strong>
                        <span>AI Assistant</span>
                    </div>
                </div>
                <button
                    class="close-sidebar"
                    id="closeSidebar"
                    type="button"
                    aria-label="Close menu"
                >
                    ×
                </button>
            </div>
            <!-- NEW CHAT -->
            <button
                class="new-chat"
                id="newChat"
                type="button"
            >
                <span>＋</span>
                <span>New Chat</span>
            </button>
            <!-- SIDEBAR MENU -->
            <nav class="sidebar-menu">
                <button type="button">
                    <span>💬</span>
                    <span>Chat</span>
                </button>
                <button type="button">
                    <span>🖼️</span>
                    <span>Image Editor</span>
                </button>
                <button type="button">
                    <span>💻</span>
                    <span>Coding</span>
                </button>
                <button type="button">
                    <span>📚</span>
                    <span>Learning</span>
                </button>
            </nav>
            <!-- SIDEBAR FOOTER -->
            <div class="sidebar-footer">
                <div class="ai-status">
                    <span class="status-dot"></span>
                    <span>PRIEST AI Online</span>
                </div>
                <div class="version">
                    Version 1.0
                </div>
            </div>
        </aside>
        <!-- ================= MAIN ================= -->
        <main class="main">
            <!-- TOP BAR -->
            <header class="topbar">
                <div class="topbar-left">
                    <button
                        id="menuButton"
                        class="menu-button"
                        type="button"
                        aria-label="Open menu"
                    >
                        ☰
                    </button>
                    <div class="mobile-brand">
                        <div class="mobile-logo">P</div>
                        <strong>PRIEST AI</strong>
                    </div>
                </div>
                <div class="topbar-actions">
                    <!-- THEME -->
                    <button
                        id="themeToggle"
                        class="icon-button"
                        type="button"
                        aria-label="Toggle theme"
                    >
                        ☀️
                    </button>
                </div>
            </header>
            <!-- ================= CHAT AREA ================= -->
            <section
                class="chat"
                id="chat"
                aria-live="polite"
            >
                <!-- WELCOME SCREEN -->
                <div
                    class="welcome"
                    id="welcome"
                >
                    <div class="welcome-logo">
                        P
                    </div>
                    <h1>
                        Welcome to PRIEST AI
                    </h1>
                    <p>
                        Your AI assistant for questions, ideas,
                        coding, learning and creative work.
                    </p>
                    <!-- SUGGESTIONS -->
                    <div class="suggestions">
                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="What can you help me with?"
                        >
                            <span>💡</span>
                            <span>What can you help me with?</span>
                        </button>
                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="Help me write some code"
                        >
                            <span>💻</span>
                            <span>Help me write some code</span>
                        </button>
                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="Explain something to me"
                        >
                            <span>📚</span>
                            <span>Explain something to me</span>
                        </button>
                    </div>
                </div>
            </section>
            <!-- ================= INPUT AREA ================= -->
            <footer class="input-area">
                <form
                    id="chatForm"
                    class="chat-form"
                    autocomplete="off"
                >
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="messageInput"
                            name="message"
                            placeholder="Message PRIEST AI..."
                            autocomplete="off"
                            aria-label="Message PRIEST AI"
                            required
                        >
                        <button
                            type="submit"
                            id="sendButton"
                            class="send-button"
                            aria-label="Send message"
                        >
                            ➤
                        </button>
                    </div>
                </form>
                <div class="input-disclaimer">
                    PRIEST AI can make mistakes. Check important information.
                </div>
            </footer>
        </main>
    </div>
    <!-- ================= OVERLAY ================= -->
    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>
    <!-- ================= JAVASCRIPT ================= -->
    <script src="script.js"></script>
</body>
</html>
