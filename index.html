<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta name="theme-color" content="#080a0f">
    <title>PRIEST AI</title>
    <!-- IMPORTANT: CSS FILE -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">P</div>
                <div class="logo-text">PRIEST AI</div>
            </div>
        </div>
        <button class="new-chat" id="newChat">
            + New Chat
        </button>
        <div class="sidebar-content">
            <div class="sidebar-title">Chat History</div>
            <div class="chat-history" id="chatHistory">
                <div class="chat-item">
                    Welcome to PRIEST AI
                </div>
            </div>
        </div>
        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="user-avatar">P</div>
                <div class="user-name">Priest</div>
            </div>
        </div>
    </aside>
    <!-- MAIN -->
    <main class="main">
        <!-- TOP BAR -->
        <header class="topbar">
            <div style="display:flex; align-items:center; gap:12px;">
                <button
                    class="menu-button"
                    id="menuButton"
                    type="button"
                >
                    ☰
                </button>
                <div class="topbar-title">
                    PRIEST AI
                </div>
            </div>
            <div class="status">
                <span class="status-dot"></span>
                Online
            </div>
        </header>
        <!-- CHAT -->
        <section class="chat-container" id="chatContainer">
            <div class="chat" id="chat">
                <!-- WELCOME -->
                <div class="welcome" id="welcome">
                    <div class="welcome-logo">
                        P
                    </div>
                    <h1>
                        PRIEST AI
                    </h1>
                    <p>
                        Your AI assistant for questions, ideas,
                        coding, learning and creative work.
                    </p>
                    <div class="suggestions">
                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="What can you help me with?"
                        >
                            What can you help me with?
                        </button>
                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="Help me write some code"
                        >
                            Help me write some code
                        </button>
                        <button
                            class="suggestion"
                            type="button"
                            data-prompt="Explain something to me"
                        >
                            Explain something
                        </button>
                    </div>
                </div>
            </div>
        </section>
        <!-- IMAGE PREVIEW -->
        <div
            class="image-preview"
            id="imagePreview"
            style="display:none;"
        ></div>
        <!-- INPUT -->
        <div class="input-area">
            <div class="input-wrapper">
                <form
                    class="input-box"
                    id="chatForm"
                >
                    <label
                        class="image-upload"
                        for="imageInput"
                        title="Upload image"
                    >
                        +
                    </label>
                    <input
                        type="file"
                        id="imageInput"
                        accept="image/*"
                        hidden
                    >
                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Message PRIEST AI..."
                        autocomplete="off"
                    ></textarea>
                    <button
                        class="send-button"
                        id="sendButton"
                        type="submit"
                        title="Send"
                    >
                        ↑
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>
<!-- JAVASCRIPT -->
<script src="./script.js"></script>
</body>
</html>
